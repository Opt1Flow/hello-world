<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>News · Kiosk</title>
<!--
  The TV / kiosk view of the news digest: big type, weather warnings on top, subjects taking
  turns. Nothing to click. Open it from the laptop's server:
      http://LAPTOP-IP:8765/kiosk
  or save this file on the Pi and add the server to the address:
      file:///home/pi/kiosk.html?server=http://LAPTOP-IP:8765
  Options (add to the address, e.g. ?seconds=30&scale=1.2):
      seconds=20   how long each screen stays      scale=1    story text size (0.5 - 3)
      max=12       stories per subject             theme=light  light background
      tz=America/Edmonton   clock timezone until the first news arrives (for the copy on the Pi)
-->
<style>
  :root {
    --bg: #0e0f11; --panel: #1b1d21; --text: #f2f2f3; --muted: #a9adb4; --line: #2b2e33;
    --accent: #8db6f7; --new: #ffb86b; --warn-bg: #3d2c0e; --warn-text: #ffd27a; --warn-edge: #ff8d5c;
    --scale: 1;
  }
  :root[data-theme="light"] {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1c1c1e; --muted: #53575d; --line: #e2dfd8;
    --accent: #1d5bb8; --new: #a64200; --warn-bg: #fff3dc; --warn-text: #6e4300; --warn-edge: #d0410f;
  }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); }
  .kiosk, .kiosk body { cursor: none; }   /* full screen only; inside a dashboard card the pointer stays */
  body {
    font-family: system-ui, "Segoe UI", Roboto, "Noto Sans", "DejaVu Sans", sans-serif;
    font-size: 2.5vh; line-height: 1.3;   /* the frame stays put; ?scale= sizes the stories */
  }
  [hidden] { display: none !important; }
  /* A column: header, warnings, notes, stories (takes the rest), footer. Hidden parts take
     no space and never shift the others. */
  .screen {
    display: flex; flex-direction: column; gap: 1.6vh;
    height: 100vh; box-sizing: border-box; padding: 2.6vh 3.2vw 2vh;
  }
  .screen > * { flex: none; }
  .screen > main { flex: 1 1 0; }

  .top { display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 3vw;
         padding-bottom: 1.4vh; border-bottom: 0.25vh solid var(--line); }
  .brand { font-size: 0.9em; font-weight: 700; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; }
  .edline { font-size: 1.45em; font-weight: 650; margin-top: 0.15em; }
  .right { text-align: right; }
  .clock { font-size: 3.3em; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
  .date, .wx { color: var(--muted); font-size: 0.95em; margin-top: 0.2em; }

  .alerts { background: var(--warn-bg); color: var(--warn-text); border-left: 0.6vw solid var(--warn-edge);
            border-radius: 1.2vh; padding: 1.2vh 1.8vw; max-height: 26vh; overflow: hidden; }
  .alerts h2 { font-size: 0.85em; letter-spacing: 0.1em; text-transform: uppercase; margin: 0 0 0.3em; }
  .alerts ul { list-style: none; margin: 0; padding: 0; }
  .alerts li { font-size: calc(1.45em * min(var(--scale), 1.3)); font-weight: 700; line-height: 1.25; }
  .alerts .meta { color: var(--warn-text); font-size: 0.6em; font-weight: 400; margin-left: 0.8em; }
  .alerts .more { font-size: 0.9em; font-weight: 600; }

  .notes { color: var(--warn-text); font-size: 1.05em;
           display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  .notes .minor { color: var(--muted); }
  .notes:empty { display: none; }

  main { display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  .subject-head { display: flex; align-items: baseline; justify-content: space-between; gap: 2vw; margin-bottom: 0.4vh; }
  #subject { font-size: 1.15em; color: var(--accent); text-transform: uppercase; letter-spacing: 0.1em; margin: 0; }
  #pageinfo { color: var(--muted); font-size: 0.9em; font-variant-numeric: tabular-nums; }
  /* The list reaches 1.6vw into the left margin (padding there isn't clipped), so the "new" bar shows. */
  #stories { list-style: none; margin: 0 0 0 -1.6vw; padding: 0 0 0 1.6vw; overflow: hidden; position: relative; min-height: 0; }
  .story { padding: 1.4vh 0; border-top: 0.15vh solid var(--line); font-size: calc(1em * var(--scale)); }
  .story.first { border-top: 0; }
  /* Stories from a fresh edition get a bar in the margin, visible from across the room;
     the negative margin keeps line widths (and so the screen splits) unchanged. */
  .story.new { border-left: 0.5vw solid var(--new); margin-left: -1.3vw; padding-left: 0.8vw; }
  .headline {
    font-size: 1.75em; font-weight: 650; line-height: 1.22;
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 4; overflow: hidden;
  }
  .meta { color: var(--muted); font-size: 0.95em; margin-top: 0.35em; }
  .message { font-size: 1.6em; color: var(--muted); margin: 6vh 0 0; max-width: 40em; list-style: none; }
  .fade { animation: fade 0.5s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; } }

  footer { display: grid; gap: 1vh; }
  #dots { display: flex; gap: 0.6vw; flex-wrap: nowrap; overflow: hidden; color: var(--muted); font-size: 0.85em; }
  .dot { padding: 0.15em 0.7em; border-radius: 999px; white-space: nowrap; }
  .dot.on { background: var(--accent); color: var(--bg); font-weight: 650; }
  .bar { height: 0.5vh; background: var(--line); border-radius: 999px; overflow: hidden; }
  #bar { height: 100%; width: 0; background: var(--accent); }
</style>
</head>
<body>
<div class="screen">
  <header class="top">
    <div>
      <div class="brand">News</div>
      <div class="edline" id="edline">Loading…</div>
    </div>
    <div class="right">
      <div class="clock" id="clock"></div>
      <div class="date" id="date"></div>
      <div class="wx" id="wx"></div>
    </div>
  </header>
  <section class="alerts" id="alerts" hidden>
    <h2 id="alerts-title"></h2>
    <ul id="alerts-list"></ul>
  </section>
  <div class="notes" id="notes"></div>
  <main>
    <div class="subject-head"><h1 id="subject"></h1><span id="pageinfo"></span></div>
    <ol id="stories"></ol>
  </main>
  <footer>
    <nav id="dots" aria-label="Subjects"></nav>
    <div class="bar"><div id="bar"></div></div>
  </footer>
</div>
<script>
(function () {
  "use strict";
  // ---- Options from the address
  var params = new URLSearchParams(location.search);
  function option(name, fallback, min, max) {
    var v = parseFloat(params.get(name));
    return isNaN(v) ? fallback : Math.min(max, Math.max(min, v));
  }
  var SECONDS = option("seconds", 20, 5, 600), MAX = Math.round(option("max", 12, 1, 50));
  var root = document.documentElement;
  root.style.setProperty("--scale", String(option("scale", 1, 0.5, 3)));
  if (params.get("theme") === "light") root.setAttribute("data-theme", "light");
  var server = (params.get("server") || "").trim().replace(/\/+$/, "");
  if (server && !/^https?:\/\//i.test(server)) server = "http://" + server;
  var DATA_URL = server + "/news.json";
  var fromFile = location.protocol === "file:";
  if (window.top === window) root.classList.add("kiosk");   // hide the pointer only when full screen
  var startZone = params.get("tz") || root.getAttribute("data-tz") || undefined;

  function $(id) { return document.getElementById(id); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = text;   // feed text is never HTML
    return e;
  }
  function load(key) { try { return localStorage.getItem("newsbot.kiosk." + key); } catch (e) { return null; } }
  function save(key, value) { try { localStorage.setItem("newsbot.kiosk." + key, value); } catch (e) {} }

  // ---- Times, in the bot's timezone (from the data) whatever the Pi is set to
  var fmt;
  function makeFormats(zone) {
    function f(opts, locale) {
      try { return new Intl.DateTimeFormat(locale, Object.assign({ timeZone: zone || undefined }, opts)); }
      catch (e) { return new Intl.DateTimeFormat(locale, opts); }
    }
    fmt = {
      clock: f({ hour: "2-digit", minute: "2-digit", hourCycle: "h23" }, "en-GB"),
      day: f({ weekday: "short" }, "en-GB"),
      date: f({ weekday: "long", day: "numeric", month: "long" }, "en-GB"),
      ymd: f({ year: "numeric", month: "2-digit", day: "2-digit" }, "en-CA")
    };
  }
  makeFormats(startZone);
  function clock(ms) { return fmt.clock.format(new Date(ms)); }
  function when(ms) {
    var d = new Date(ms);
    return fmt.ymd.format(d) === fmt.ymd.format(new Date()) ? clock(ms) : fmt.day.format(d) + " " + clock(ms);
  }
  function ago(ms) {
    if (isNaN(ms)) return "";
    var mins = Math.round((Date.now() - ms) / 60000);
    if (mins < -2) return when(ms);
    if (mins < 2) return "just now";
    if (mins < 60) return mins + " min ago";
    if (mins < 24 * 60) return Math.round(mins / 60) + " h ago";
    return when(ms);
  }

  // ---- Turning the bot's data into screens
  var data = null, model = { latest: null, subjects: [], alerts: [], wx: "" }, rebuildPending = false;
  var DAY = 26 * 3600000;   // editions older than this (laptop off for days) aren't shown as news

  function buildModel(d) {
    var now = Date.now();
    var eds = (d.editions || []).filter(function (e) {
      var made = Date.parse(e.produced_at || "");
      return e.kind === "ok" && !isNaN(made) && now - made < DAY;
    }).sort(function (a, b) { return Date.parse(b.produced_at) - Date.parse(a.produced_at); });
    // "New" only means something while the newest edition is recent.
    var fresh = eds.length > 0 && now - Date.parse(eds[0].produced_at) < 8 * 3600000;
    var order = [];
    eds.forEach(function (e) {
      Object.keys(e.subjects || {}).forEach(function (s) { if (order.indexOf(s) < 0) order.push(s); });
    });
    // Each subject shows the newest edition's stories first ("New"), then earlier ones today.
    var subjects = order.map(function (name) {
      var stories = [];
      eds.forEach(function (e, i) {
        (e.subjects[name] || []).forEach(function (st) {
          stories.push({ title: st.title, source: st.source, time: st.time, isNew: fresh && i === 0 });
        });
      });
      return { name: name, stories: stories.slice(0, MAX) };
    }).filter(function (s) { return s.stories.length > 0; });

    var latest = eds[0] || null, alerts = [], wx = "";
    var groups = (latest && latest.alerts && latest.alerts.groups) || [];
    groups.forEach(function (g) {
      (g.items || []).forEach(function (a) { alerts.push({ group: g.name, title: a.title, source: a.source, time: a.time }); });
    });
    if (groups.length && !alerts.length) {
      var failed = groups.filter(function (g) { return g.failed; }).map(function (g) { return g.name; });
      var checked = Date.parse((latest.alerts || {}).checked || "");
      wx = failed.length ? failed.join(", ") + " warnings couldn't be checked"
                         : "No " + groups.map(function (g) { return g.name.toLowerCase(); }).join(" or ") +
                           " warnings" + (isNaN(checked) ? "" : " · checked " + when(checked));
    }
    var newestEver = 0;
    (d.editions || []).forEach(function (e) {
      var made = Date.parse(e.produced_at || "");
      if (e.kind === "ok" && made > newestEver) newestEver = made;
    });
    return { latest: latest, subjects: subjects, alerts: alerts, wx: wx, newestEver: newestEver };
  }

  // "SNOWFALL WARNING IN EFFECT, City of Calgary" -> "Snowfall warning, City of Calgary"
  function tidyAlert(t) {
    t = String(t || "").replace(/\s+in effect\b/i, "");
    return t.replace(/^[^a-z,]+(?=,|$)/, function (c) { return c.charAt(0) + c.slice(1).toLowerCase(); });
  }

  function renderAlerts() {
    var box = $("alerts"), list = $("alerts-list");
    list.textContent = "";
    box.hidden = model.alerts.length === 0;
    if (box.hidden) return;
    var names = [];
    model.alerts.forEach(function (a) { if (names.indexOf(a.group) < 0) names.push(a.group); });
    $("alerts-title").textContent = names.join(" & ") + (model.alerts.length === 1 ? " warning" : " warnings") + " in effect";
    model.alerts.forEach(function (a) {
      var li = el("li", null, tidyAlert(a.title));
      if (a.time) li.appendChild(el("span", "meta", "issued " + when(Date.parse(a.time))));
      list.appendChild(li);
    });
    // If they don't all fit, drop the last ones and say how many more there are.
    var more = null;
    while (box.scrollHeight > box.clientHeight + 1 && list.children.length > (more ? 2 : 1)) {
      if (!more) more = list.appendChild(el("li", "more"));
      list.removeChild(more.previousSibling);
      more.textContent = "+ " + (model.alerts.length - list.children.length + 1) + " more on the reading page";
    }
  }

  // ---- Rotation: each subject, page by page, SECONDS per screen
  var pos = { subject: 0, page: 0, pages: [[0, 0]] }, shownAt = Date.now();

  function renderSubject() {
    var subj = model.subjects[pos.subject], list = $("stories");
    list.textContent = "";
    $("pageinfo").textContent = "";
    if (!subj) {
      pos.pages = [[0, 1]];
      pos.page = 0;
      $("subject").textContent = "";
      list.appendChild(el("li", "message", emptyMessage()));
      renderDots();
      return;
    }
    $("subject").textContent = subj.name;
    subj.stories.forEach(function (st) {
      var li = el("li", "story" + (st.isNew ? " new" : ""));
      li.appendChild(el("div", "headline", st.title));
      li.appendChild(el("div", "meta", [st.source, st.time ? ago(Date.parse(st.time)) : ""].filter(Boolean).join(" · ")));
      list.appendChild(li);
    });
    paginate();
    showPage();
    renderDots();
  }

  // Split the stories into screens that fit: measure each one, start a new screen at the
  // first story that would run past the bottom.
  function paginate() {
    var list = $("stories"), items = list.children, avail = list.clientHeight;
    for (var k = 0; k < items.length; k++) items[k].hidden = false;
    var pages = [], start = 0, top = items.length ? items[0].offsetTop : 0;
    for (var i = 0; i < items.length; i++) {
      if (items[i].offsetTop + items[i].offsetHeight - top > avail && i > start) {
        pages.push([start, i]);
        start = i;
        top = items[i].offsetTop;
      }
    }
    pages.push([start, items.length]);
    pos.pages = pages;
    if (pos.page >= pages.length) pos.page = 0;
  }

  function showPage() {
    var p = pos.pages[pos.page], items = $("stories").children;
    for (var i = 0; i < items.length; i++) {
      items[i].hidden = i < p[0] || i >= p[1];
      items[i].classList.toggle("first", i === p[0]);
    }
    $("pageinfo").textContent = pos.pages.length > 1 ? (pos.page + 1) + " / " + pos.pages.length : "";
    var list = $("stories");
    list.classList.remove("fade");
    void list.offsetWidth;   // restart the fade-in
    list.classList.add("fade");
  }

  function renderDots() {
    var dots = $("dots");
    dots.textContent = "";
    model.subjects.forEach(function (s, i) { dots.appendChild(el("span", "dot" + (i === pos.subject ? " on" : ""), s.name)); });
  }

  function advance() {
    shownAt = Date.now();
    if (pos.page + 1 < pos.pages.length) { pos.page++; showPage(); return; }
    var current = model.subjects[pos.subject] && model.subjects[pos.subject].name;
    // After a full round, rebuild anyway so stories age out even if the laptop stays away.
    if (pos.subject + 1 >= model.subjects.length) rebuildPending = true;
    if (rebuildPending && data) rebuild(current, true);   // new data waits for a subject change
    if (!model.subjects.length) { renderSubject(); return; }
    pos.subject = (pos.subject + 1) % model.subjects.length;
    pos.page = 0;
    renderSubject();
  }

  function rebuild(keepSubject, quiet) {
    rebuildPending = false;
    model = buildModel(data);
    var i = -1;
    model.subjects.forEach(function (s, k) { if (s.name === keepSubject) i = k; });
    pos.subject = quiet ? i : Math.max(0, i);   // quiet: advance() moves on from here
    pos.page = 0;
    renderAlerts();
    renderStatus();   // fill the lines above the stories before measuring them
    if (!quiet) { renderSubject(); shownAt = Date.now(); }
  }

  // ---- Status lines
  var failingSince = 0, answered = false;   // answered: the laptop replied, but had no news yet
  function emptyMessage() {
    if (!data) {
      if (fromFile && !server) return "Add the news laptop to this page's address, e.g. ?server=http://192.168.1.50:8765";
      if (answered) return "The news laptop is on, but has no edition to show yet. The first one appears after the next scheduled run.";
      return failingSince ? "Waiting for the news laptop at " + (server || location.host) + " (it may be asleep)…"
                          : "Loading the news…";
    }
    if (model.latest) return "No new stories in the last day.";
    if (model.newestEver) return "No news since " + when(model.newestEver) + " (was the laptop off?).";
    return "No edition yet. The first one appears after the next scheduled run.";
  }

  function renderStatus() {
    var now = Date.now(), notes = [], minor = "";
    $("clock").textContent = clock(now);
    $("date").textContent = fmt.date.format(new Date(now));
    $("wx").textContent = model.wx;
    var latest = model.latest;
    var line = latest ? latest.name + " edition · " + when(Date.parse(latest.produced_at)) : (data ? "No edition yet" : "News");
    var next = data && data.next && Date.parse(data.next.time);
    if (next && !isNaN(next)) line += " · next " + data.next.name + " " + when(next);
    $("edline").textContent = line;

    if (fromFile && !server) {
      notes.push("Add ?server=http://LAPTOP-IP:8765 to this page's address to get new editions.");
    } else if (failingSince && answered) {
      if (data) notes.push("The news laptop has no news to share right now. Showing what it last sent.");
    } else if (failingSince) {
      notes.push("Can't reach the news laptop since " + when(failingSince) + " (asleep or off?)." +
                 (data ? " Showing what it last sent." : ""));
    } else if (next && now > next + 20 * 60000) {
      notes.push("The " + data.next.name + " edition (" + clock(next) + ") is late.");
    }
    if (data && data.problem && data.problem.message) {
      notes.push(String(data.problem.message).split(/([.!?])\s/).slice(0, 2).join(""));   // first sentence
    }
    var missing = (latest && (latest.missing || [])) || [];
    if (missing.length) {
      var names = [];
      missing.forEach(function (m) { var n = typeof m === "string" ? m : m.name; if (names.indexOf(n) < 0) names.push(n); });
      minor = names.join(", ") + " didn't answer this time";
    }
    var box = $("notes"), text = notes.join("  ·  ");
    if (box.getAttribute("data-text") === text + "|" + minor) return;   // unchanged: leave the layout alone
    box.setAttribute("data-text", text + "|" + minor);
    box.textContent = text;
    if (minor) box.appendChild(el("span", "minor", (text ? "  ·  " : "") + minor));
  }

  // ---- Fetching: every minute; the screen keeps the last good news if the laptop is away
  function use(d) {
    var changed = !data || d.generated !== data.generated;
    data = d;
    makeFormats(d.timezone);
    if (changed) {
      var current = model.subjects[pos.subject] && model.subjects[pos.subject].name;
      if (!model.subjects.length) rebuild(current, false);
      else rebuildPending = true;   // switch at the next subject, not mid-screen
    }
    renderStatus();
  }

  function refresh() {
    if (fromFile && !server) { renderStatus(); if (!data) renderSubject(); return; }
    answered = false;
    var ctrl = window.AbortController ? new AbortController() : null;
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 15000) : null;
    fetch(DATA_URL, { cache: "no-store", signal: ctrl ? ctrl.signal : undefined })
      .then(function (r) {
        answered = true;
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (text) {
        var d = JSON.parse(text);
        failingSince = 0;
        save("data", text);
        use(d);
      })
      .catch(function () {
        if (!failingSince) failingSince = Date.now();
        // A network error leaves `answered` false; a reply like 503 (no edition yet) sets it.
        renderStatus();
        if (!data) renderSubject();
      })
      .then(function () { if (timer) clearTimeout(timer); });
  }

  // Start with what we showed last time (so a laptop that's asleep still leaves news on screen).
  try { var cached = load("data"); if (cached) use(JSON.parse(cached)); } catch (e) {}
  if (!model.subjects.length) renderSubject();
  renderStatus();
  refresh();
  setInterval(refresh, 60000);
  setInterval(function () {
    var elapsed = (Date.now() - shownAt) / 1000;
    $("bar").style.width = Math.min(100, elapsed / SECONDS * 100) + "%";
    if (elapsed >= SECONDS) advance();
    renderStatus();
  }, 1000);
  // Re-split the stories whenever their area changes size (a warning or a note appears,
  // the window is resized), so a screen never runs past the bottom.
  function refit() { if (model.subjects[pos.subject]) { paginate(); showPage(); } }
  if (window.ResizeObserver) new ResizeObserver(refit).observe($("stories"));
  else window.addEventListener("resize", refit);
})();
</script>
</body>
</html>
